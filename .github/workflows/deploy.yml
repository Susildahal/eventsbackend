name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/myprojects
            if [ ! -d "eventsbackend/.git" ]; then
              git clone git@github.com:Susildahal/eventsbackend.git
            else
              cd eventsbackend
              git reset --hard
              git pull origin main
            fi
            cd eventsbackend
            npm ci
            pm2 restart eventsbackend || pm2 start npm --name eventsbackend -- start

            env:
              # PORT: ${{ secrets.PORT }}
              # MONGODB_URI: ${{ secrets.MONGODB_URI }}
              # JWT_SECRET: ${{ secrets.JWT_SECRET }}
              # SMTP_HOST: ${{ secrets.SMTP_HOST }}
              # SMTP_PORT: ${{ secrets.SMTP_PORT }}
              # SMTP_USER: ${{ secrets.SMTP_USER }}
              # SMTP_PASS: ${{ secrets.SMTP_PASS }}
              # SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
              # name:${{ secrets.name }}
              # role:${{ secrets.role }}
              # address:${{ secrets.address }}
              # phone:${{ secrets.phone }}
              # NODE_ENV: production
              
              


            

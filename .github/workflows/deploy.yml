name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/myprojects/eventbackned
            if [ ! -d "eventsbackend/.git" ]; then
              git clone git@github.com:Susildahal/eventsbackend.git eventsbackend
              cd eventsbackend
            else
              cd eventsbackend
              git reset --hard
              git pull origin main
            fi
            rm -rf node_modules package-lock.json
            npm install
            pm2 restart eventsbackend || pm2 start index.js --name eventsbackend
